name: Publish to npm

# Publishes when a GitHub release is created. The release tag must match
# package.json's version, e.g. tag v0.2.0 for version 0.2.0.
#
# Auth uses npm Trusted Publishing (OIDC): no NPM_TOKEN secret is needed.
# One-time setup, after the first manual publish:
#   npmjs.com -> package -> Settings -> Trusted Publisher -> GitHub Actions
#   repo: ip-trust/iptrust-node, workflow: publish.yml
on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write # required for OIDC trusted publishing + provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24 # npm >= 11.5.1 is required for trusted publishing
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - name: Check tag matches package.json version
        run: |
          PKG_VERSION="$(node -p "require('./package.json').version")"
          TAG="${GITHUB_REF_NAME#v}"
          if [ "$PKG_VERSION" != "$TAG" ]; then
            echo "Tag v$TAG does not match package.json version $PKG_VERSION" >&2
            exit 1
          fi
      # prepublishOnly runs typecheck, test and build.
      - run: npm publish --provenance --access public
